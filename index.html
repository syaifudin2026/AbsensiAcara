<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Kegiatan Madrasah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & AutoTable untuk PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        madrasah: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar untuk tabel horizontal di HP */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #059669; }
        
        /* Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Perbesar tap area radio button untuk mobile */
        input[type="radio"] {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 md:translate-x-0 md:left-auto md:right-5 translate-y-[-150%] md:translate-y-0 md:translate-x-full transition-all duration-300 z-50 rounded shadow-lg flex items-center px-4 py-3 text-white font-medium w-11/12 md:w-auto max-w-sm">
        <i id="toast-icon" class="fas mr-2"></i>
        <span id="toast-msg">Pesan</span>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/90 z-40 hidden flex-col items-center justify-center backdrop-blur-sm">
        <div class="loader mb-4"></div>
        <p class="text-madrasah-600 font-semibold tracking-wide animate-pulse" id="loading-text">Memuat data...</p>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar" class="bg-madrasah-600 text-white shadow-md hidden sticky top-0 z-30">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 text-lg md:text-xl font-bold">
                <i class="fas fa-mosque"></i>
                <span class="truncate">Absensi Madrasah</span>
            </div>
            <button onclick="logout()" class="hover:bg-madrasah-700 bg-madrasah-700/50 px-3 py-1.5 rounded-lg transition text-sm md:text-base flex items-center">
                <i class="fas fa-sign-out-alt md:mr-1"></i> <span class="hidden md:inline">Keluar</span>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow container mx-auto px-4 py-6 w-full max-w-7xl pb-20" id="app-content">
        <!-- Views will be injected here by JavaScript -->
    </main>

    <!-- TEMPLATES (Hidden, used by JS) -->

    <!-- 1. LOGIN VIEW -->
    <template id="tpl-login">
        <div class="max-w-md mx-auto mt-10 md:mt-20 bg-white rounded-2xl shadow-xl overflow-hidden p-8 md:p-10 border-t-4 border-madrasah-500 mx-4 md:mx-auto">
            <div class="text-center mb-8">
                <div class="bg-madrasah-50 text-madrasah-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                    <i class="fas fa-shield-alt text-4xl"></i>
                </div>
                <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Login Admin</h2>
                <p class="text-sm text-gray-500 mt-2">Sistem Rekap Kehadiran Kegiatan</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password Akses</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-madrasah-500 focus:border-transparent transition-all" id="password" type="password" placeholder="Masukkan password admin" required>
                    </div>
                </div>
                <button class="w-full bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-all transform active:scale-95 shadow-md flex justify-center items-center gap-2" type="submit">
                    Masuk ke Sistem <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </template>

    <!-- 2. DASHBOARD VIEW -->
    <template id="tpl-dashboard">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800 border-l-4 border-madrasah-500 pl-3">Daftar Kegiatan</h2>
            <button onclick="navigate('createEvent')" class="w-full md:w-auto bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-2.5 px-5 rounded-lg shadow-md transition-all flex items-center justify-center transform active:scale-95">
                <i class="fas fa-plus mr-2"></i> Buat Kegiatan
            </button>
        </div>
        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Event cards will be populated here -->
        </div>
    </template>

    <!-- 3. CREATE EVENT VIEW -->
    <template id="tpl-create-event">
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8 border-t-4 border-madrasah-500">
            <div class="flex items-center justify-between mb-6 border-b pb-4">
                <h2 class="text-lg md:text-xl font-bold text-gray-800"><i class="fas fa-calendar-plus mr-2 text-madrasah-600"></i>Buat Kegiatan Baru</h2>
                <button onclick="navigate('dashboard')" class="text-gray-400 hover:text-red-500 transition-colors p-2"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form onsubmit="handleCreateEvent(event)">
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nama Kegiatan</label>
                    <input id="ev-name" class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-madrasah-500 focus:border-transparent transition-all" type="text" placeholder="Contoh: MPLS 2026" required>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tanggal Mulai</label>
                        <input id="ev-start" class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-madrasah-500 focus:border-transparent transition-all" type="date" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tanggal Selesai</label>
                        <input id="ev-end" class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-madrasah-500 focus:border-transparent transition-all" type="date" required>
                    </div>
                </div>
                <div class="flex flex-col-reverse md:flex-row justify-end gap-3">
                    <button type="button" onclick="navigate('dashboard')" class="w-full md:w-auto bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 px-6 rounded-lg transition-colors">Batal</button>
                    <button type="submit" class="w-full md:w-auto bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md transition-transform transform active:scale-95">Simpan Kegiatan</button>
                </div>
            </form>
        </div>
    </template>

    <!-- 4. ATTENDANCE VIEW -->
    <template id="tpl-attendance">
        <!-- Header Section -->
        <div class="mb-5 bg-white rounded-2xl shadow-sm p-5 border border-gray-100">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <div>
                    <button onclick="navigate('dashboard')" class="text-gray-500 hover:text-madrasah-600 text-sm font-semibold mb-2 inline-flex items-center transition-colors">
                        <i class="fas fa-arrow-left mr-1"></i> Kembali
                    </button>
                    <h2 id="att-event-name" class="text-xl md:text-2xl font-bold text-gray-800 leading-tight">Nama Acara</h2>
                    <p id="att-event-dates" class="text-sm text-gray-500 mt-1"><i class="far fa-calendar-alt mr-1"></i> - </p>
                </div>
                <button onclick="generatePDF()" class="w-full md:w-auto bg-red-50 text-red-600 hover:bg-red-500 hover:text-white border border-red-200 font-semibold py-2 px-4 rounded-lg transition-all flex items-center justify-center shadow-sm">
                    <i class="fas fa-file-pdf mr-2"></i> Unduh Rekap PDF
                </button>
            </div>
            
            <hr class="border-gray-100 my-4">

            <!-- Date Picker Control -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div class="flex flex-col w-full sm:w-auto">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Tanggal Absensi</label>
                    <div class="relative">
                        <input type="date" id="att-date-picker" onchange="loadAttendanceData()" class="w-full sm:w-auto bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-madrasah-500 focus:border-madrasah-500 block pl-3 pr-10 py-2">
                    </div>
                </div>
                <div class="text-xs text-blue-600 bg-blue-50 px-3 py-2 rounded-lg border border-blue-100 flex items-center w-full sm:w-auto">
                    <i class="fas fa-info-circle mr-2 text-lg"></i>
                    Pastikan memilih tanggal yang sesuai dengan rentang kegiatan.
                </div>
            </div>
        </div>

        <!-- Tombol Tandai Semua Hadir -->
        <div class="flex justify-end mb-3">
            <button onclick="markAllPresent()" class="w-full sm:w-auto bg-madrasah-50 text-madrasah-700 hover:bg-madrasah-100 font-semibold py-2 px-4 rounded-lg text-sm transition-all flex items-center justify-center border border-madrasah-200 shadow-sm active:scale-95">
                <i class="fas fa-check-double mr-2"></i> Tandai Semua Hadir Penuh
            </button>
        </div>

        <!-- Table Card -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-200">
            <div class="overflow-x-auto pb-2">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs md:text-sm uppercase tracking-wide border-b border-gray-200">
                            <th class="py-4 px-4 font-bold w-12 text-center">No</th>
                            <th class="py-4 px-4 font-bold min-w-[180px]">Nama Guru</th>
                            <th class="py-4 px-2 font-bold text-center text-green-700">Hadir Penuh</th>
                            <th class="py-4 px-2 font-bold text-center text-yellow-600">Hadir Sbg.</th>
                            <th class="py-4 px-2 font-bold text-center text-blue-600">Izin</th>
                            <th class="py-4 px-2 font-bold text-center text-red-600">Alpha</th>
                        </tr>
                    </thead>
                    <tbody id="att-table-body" class="text-sm divide-y divide-gray-100">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Sticky Footer for Save Button on Mobile -->
            <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end sticky bottom-0 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <button onclick="saveAttendance()" class="w-full sm:w-auto bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform active:scale-95 flex items-center justify-center gap-2 text-lg sm:text-base">
                    <i class="fas fa-save"></i> Simpan Kehadiran
                </button>
            </div>
        </div>
    </template>

    <script>
        // ==========================================
        // KONFIGURASI UTAMA
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA!
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwaH1_xCndRlhKu-Pw7HxvHolCnp9a_87e6kB-LvPMQIFcFDyEoZrPjoJjcqeEAbL8V/exec"; 
        const ADMIN_PASSWORD = "dea123"; // Ganti dengan password yang diinginkan

        // --- DATA MOCK UNTUK PREVIEW ---
        // Digunakan jika GAS_URL masih berupa placeholder / URL Dummy
        const isDummyURL = GAS_URL.includes("XXXXXXXXXXXXXXXXXXXXX");
        let mockDB = {
            events: [
                { id: 'EVT_1', name: 'MPLS 2026', startDate: '2026-07-10', endDate: '2026-07-15' }
            ],
            teachers: [
                { id: '1', name: 'Budi Santoso' },
                { id: '2', name: 'Siti Aminah' },
                { id: '3', name: 'Ahmad Dahlan' },
                { id: '4', name: 'Rina Kusuma' }
            ],
            attendance: []
        };

        // State Aplikasi
        let state = {
            isLoggedIn: false,
            events: [],
            teachers: [],
            currentEvent: null,
            selectedDate: null,
            currentAttendance: []
        };

        // ==========================================
        // UTILITAS UI
        // ==========================================
        function showLoading(text = "Memuat...") {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loading').classList.add('flex');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('loading').classList.remove('flex');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-msg');
            
            msg.innerText = message;
            
            // Handle mobile/desktop positioning via translate
            let baseClasses = 'fixed z-50 rounded shadow-lg flex items-center px-4 py-3 text-white font-medium w-11/12 md:w-auto max-w-sm transition-all duration-300 top-5 left-1/2 md:left-auto md:right-5';
            
            if (type === 'success') {
                toast.className = baseClasses + ' bg-green-500';
                icon.className = 'fas fa-check-circle text-lg';
            } else if (type === 'error') {
                toast.className = baseClasses + ' bg-red-500';
                icon.className = 'fas fa-exclamation-circle text-lg';
            } else {
                toast.className = baseClasses + ' bg-blue-500';
                icon.className = 'fas fa-info-circle text-lg';
            }

            // Animate In (center on mobile, right on desktop)
            setTimeout(() => {
                toast.style.transform = window.innerWidth < 768 ? 'translate(-50%, 0)' : 'translate(0, 0)';
            }, 10);

            // Animate Out
            setTimeout(() => {
                toast.style.transform = window.innerWidth < 768 ? 'translate(-50%, -150%)' : 'translate(150%, 0)';
            }, 3000);
        }

        function formatDate(dateString) {
            if(!dateString) return "-";
            const d = new Date(dateString);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // ==========================================
        // FUNGSI API (Komunikasi dengan GAS / Mock)
        // ==========================================
        async function fetchFromGAS(action, params = {}) {
            // Gunakan Mock Data jika URL masih berupa placeholder
            if (isDummyURL) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        if (action === 'getEvents') resolve(mockDB.events);
                        else if (action === 'getTeachers') resolve(mockDB.teachers);
                        else if (action === 'getAttendance') {
                            resolve(mockDB.attendance.filter(a => a.eventId === params.eventId && a.date === params.date));
                        }
                        else if (action === 'getAllAttendanceForEvent') {
                            resolve(mockDB.attendance.filter(a => a.eventId === params.eventId));
                        }
                        else resolve([]);
                    }, 500); // Simulasi delay jaringan
                });
            }

            let url = new URL(GAS_URL);
            url.searchParams.append('action', action);
            for (let key in params) {
                url.searchParams.append(key, params[key]);
            }
            
            try {
                const response = await fetch(url.toString());
                const result = await response.json();
                if (result.status === "error") throw new Error(result.message);
                return result.data;
            } catch (error) {
                console.error("Fetch Error:", error);
                throw error;
            }
        }

        async function postToGAS(action, data) {
            // Gunakan Mock Data jika URL masih berupa placeholder
            if (isDummyURL) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        if (action === 'createEvent') {
                            const newId = 'EVT_' + Date.now();
                            mockDB.events.push({ id: newId, name: data.name, startDate: data.startDate, endDate: data.endDate });
                            resolve({ id: newId });
                        }
                        else if (action === 'saveAttendance') {
                            // Hapus data lama (update logic)
                            mockDB.attendance = mockDB.attendance.filter(a => !(a.eventId === data.eventId && a.date === data.date));
                            // Insert data baru
                            data.attendanceList.forEach(item => {
                                mockDB.attendance.push({
                                    eventId: data.eventId,
                                    date: data.date,
                                    teacherId: item.teacherId,
                                    teacherName: item.teacherName,
                                    status: item.status
                                });
                            });
                            resolve("Saved");
                        }
                    }, 500); // Simulasi delay jaringan
                });
            }

            try {
                const formData = new URLSearchParams();
                formData.append('action', action);
                formData.append('data', JSON.stringify(data));

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.status === "error") throw new Error(result.message);
                return result.data;
            } catch (error) {
                console.error("Post Error:", error);
                throw error;
            }
        }

        // ==========================================
        // ROUTING & RENDERING
        // ==========================================
        function initApp() {
            if (state.isLoggedIn) {
                document.getElementById('navbar').classList.remove('hidden');
                loadInitialData().then(() => navigate('dashboard'));
            } else {
                document.getElementById('navbar').classList.add('hidden');
                navigate('login');
            }
        }

        function navigate(view) {
            const content = document.getElementById('app-content');
            content.innerHTML = '';
            let tpl;

            if (view === 'login') tpl = document.getElementById('tpl-login').innerHTML;
            if (view === 'dashboard') {
                tpl = document.getElementById('tpl-dashboard').innerHTML;
                content.innerHTML = tpl;
                renderEventsList();
                window.scrollTo(0, 0);
                return;
            }
            if (view === 'createEvent') tpl = document.getElementById('tpl-create-event').innerHTML;
            if (view === 'attendance') {
                tpl = document.getElementById('tpl-attendance').innerHTML;
                content.innerHTML = tpl;
                setupAttendanceView();
                window.scrollTo(0, 0);
                return;
            }

            content.innerHTML = tpl;
            window.scrollTo(0, 0);
        }

        // ==========================================
        // LOGIC APLIKASI
        // ==========================================
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            if (pass === ADMIN_PASSWORD) {
                state.isLoggedIn = true;
                showToast('Login berhasil!');
                initApp();
            } else {
                showToast('Password salah!', 'error');
            }
        }

        function logout() {
            state.isLoggedIn = false;
            initApp();
        }

        async function loadInitialData() {
            showLoading("Memuat data sistem...");
            try {
                const [events, teachers] = await Promise.all([
                    fetchFromGAS('getEvents'),
                    fetchFromGAS('getTeachers')
                ]);
                state.events = events;
                state.teachers = teachers;
                
                if(isDummyURL) {
                    setTimeout(() => showToast("Mode Preview: Menggunakan Data Simulasi", "info"), 500);
                }
            } catch (error) {
                showToast("Gagal memuat data. Periksa koneksi atau URL Script.", "error");
            } finally {
                hideLoading();
            }
        }

        function renderEventsList() {
            const grid = document.getElementById('events-grid');
            if (state.events.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 bg-white rounded-2xl border border-dashed border-gray-300">
                    <div class="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-folder-open text-2xl text-gray-400 block"></i>
                    </div>
                    <p class="font-medium text-gray-600">Belum ada kegiatan.</p>
                    <p class="text-sm mt-1">Silakan klik "Buat Kegiatan" untuk memulai.</p>
                </div>`;
                return;
            }

            grid.innerHTML = state.events.map(ev => {
                const sDate = new Date(ev.startDate);
                const eDate = new Date(ev.endDate);
                const now = new Date();
                
                let statusBadge = '';
                if(now < sDate) statusBadge = '<span class="bg-blue-50 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-md border border-blue-200">Akan Datang</span>';
                else if (now >= sDate && now <= eDate) statusBadge = '<span class="bg-green-50 text-green-700 text-xs font-bold px-2.5 py-1 rounded-md border border-green-200">Berlangsung</span>';
                else statusBadge = '<span class="bg-gray-100 text-gray-700 text-xs font-bold px-2.5 py-1 rounded-md border border-gray-300">Selesai</span>';

                return `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-100 flex flex-col group cursor-pointer overflow-hidden" onclick="openAttendance('${ev.id}')">
                    <div class="p-6 flex-grow">
                        <div class="flex justify-between items-start mb-4 gap-2">
                            <h3 class="text-lg font-bold text-gray-800 leading-tight group-hover:text-madrasah-600 transition-colors">${ev.name}</h3>
                            ${statusBadge}
                        </div>
                        <div class="space-y-2">
                            <p class="text-sm text-gray-600 flex items-center"><i class="fas fa-play-circle w-5 text-madrasah-500"></i> ${formatDate(ev.startDate)}</p>
                            <p class="text-sm text-gray-600 flex items-center"><i class="fas fa-stop-circle w-5 text-red-400"></i> ${formatDate(ev.endDate)}</p>
                        </div>
                    </div>
                    <div class="bg-gray-50/50 p-4 border-t border-gray-100 flex justify-between items-center group-hover:bg-madrasah-50 transition-colors">
                        <span class="text-xs font-semibold text-gray-500 group-hover:text-madrasah-600">Ketuk untuk kelola</span>
                        <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-madrasah-500 group-hover:bg-madrasah-500 group-hover:text-white transition-all">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function handleCreateEvent(e) {
            e.preventDefault();
            const name = document.getElementById('ev-name').value;
            const start = document.getElementById('ev-start').value;
            const end = document.getElementById('ev-end').value;

            if (new Date(start) > new Date(end)) {
                showToast("Tanggal selesai tidak boleh lebih awal dari tanggal mulai", "error");
                return;
            }

            showLoading("Menyimpan kegiatan...");
            try {
                const newEvent = { name, startDate: start, endDate: end };
                const res = await postToGAS('createEvent', newEvent);
                newEvent.id = res.id;
                state.events.push(newEvent); 
                showToast("Kegiatan berhasil dibuat!");
                navigate('dashboard');
            } catch (error) {
                showToast("Gagal menyimpan kegiatan", "error");
            } finally {
                hideLoading();
            }
        }

        // ==========================================
        // LOGIC ATTENDANCE (ABSENSI)
        // ==========================================
        function openAttendance(eventId) {
            state.currentEvent = state.events.find(e => e.id === eventId);
            if (!state.currentEvent) return;
            
            const todayStr = new Date().toISOString().split('T')[0];
            const startStr = state.currentEvent.startDate.split('T')[0]; 
            
            if (todayStr < startStr) state.selectedDate = startStr;
            else state.selectedDate = todayStr;

            navigate('attendance');
        }

        function setupAttendanceView() {
            const ev = state.currentEvent;
            document.getElementById('att-event-name').innerText = ev.name;
            document.getElementById('att-event-dates').innerHTML = `<i class="far fa-calendar-alt mr-1"></i> ${formatDate(ev.startDate)} s/d ${formatDate(ev.endDate)}`;
            
            const dp = document.getElementById('att-date-picker');
            dp.min = new Date(ev.startDate).toISOString().split('T')[0];
            dp.max = new Date(ev.endDate).toISOString().split('T')[0];
            dp.value = state.selectedDate;

            loadAttendanceData();
        }

        async function loadAttendanceData() {
            state.selectedDate = document.getElementById('att-date-picker').value;
            if(!state.selectedDate) return;

            showLoading("Memuat data absensi...");
            try {
                const attData = await fetchFromGAS('getAttendance', {
                    eventId: state.currentEvent.id,
                    date: state.selectedDate
                });
                state.currentAttendance = attData || [];
                renderAttendanceTable();
            } catch (error) {
                showToast("Gagal memuat absensi", "error");
            } finally {
                hideLoading();
            }
        }

        function renderAttendanceTable() {
            const tbody = document.getElementById('att-table-body');
            
            if (state.teachers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500 bg-red-50">Data guru kosong. Silakan isi Sheet 'Teachers' pada Google Sheets terlebih dahulu.</td></tr>`;
                return;
            }

            let html = '';
            state.teachers.forEach((teacher, index) => {
                const existing = state.currentAttendance.find(a => a.teacherId == teacher.id);
                const status = existing ? existing.status : 'Alpha'; 

                // Perbesar radio buttons (w-6 h-6) dan beri padding yang cukup untuk di-tap
                html += `
                <tr class="hover:bg-green-50/50 teacher-row transition-colors" data-id="${teacher.id}" data-name="${teacher.name}">
                    <td class="py-4 px-4 text-center font-medium text-gray-500">${index + 1}</td>
                    <td class="py-4 px-4 font-semibold text-gray-800">${teacher.name}</td>
                    <td class="p-2 text-center align-middle">
                        <label class="flex justify-center items-center w-full h-full cursor-pointer p-2">
                            <input type="radio" name="status_${teacher.id}" value="Hadir Penuh" class="w-6 h-6 text-green-600 focus:ring-green-500 border-gray-300" ${status === 'Hadir Penuh' ? 'checked' : ''}>
                        </label>
                    </td>
                    <td class="p-2 text-center align-middle">
                        <label class="flex justify-center items-center w-full h-full cursor-pointer p-2">
                            <input type="radio" name="status_${teacher.id}" value="Hadir Sebagian" class="w-6 h-6 text-yellow-500 focus:ring-yellow-500 border-gray-300" ${status === 'Hadir Sebagian' ? 'checked' : ''}>
                        </label>
                    </td>
                    <td class="p-2 text-center align-middle">
                        <label class="flex justify-center items-center w-full h-full cursor-pointer p-2">
                            <input type="radio" name="status_${teacher.id}" value="Izin" class="w-6 h-6 text-blue-500 focus:ring-blue-500 border-gray-300" ${status === 'Izin' ? 'checked' : ''}>
                        </label>
                    </td>
                    <td class="p-2 text-center align-middle">
                        <label class="flex justify-center items-center w-full h-full cursor-pointer p-2">
                            <input type="radio" name="status_${teacher.id}" value="Alpha" class="w-6 h-6 text-red-500 focus:ring-red-500 border-gray-300" ${status === 'Alpha' ? 'checked' : ''}>
                        </label>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // --- FUNGSI BARU: Tandai Semua Hadir Penuh ---
        function markAllPresent() {
            const rows = document.querySelectorAll('.teacher-row');
            if (rows.length === 0) return;

            rows.forEach(row => {
                const id = row.getAttribute('data-id');
                const radioHadirPenuh = row.querySelector(`input[name="status_${id}"][value="Hadir Penuh"]`);
                if (radioHadirPenuh) {
                    radioHadirPenuh.checked = true;
                }
            });
            showToast("Semua guru ditandai Hadir Penuh", "success");
        }

        async function saveAttendance() {
            if(!state.selectedDate) {
                showToast("Pilih tanggal terlebih dahulu", "error");
                return;
            }

            const rows = document.querySelectorAll('.teacher-row');
            let attendanceList = [];

            rows.forEach(row => {
                const tId = row.getAttribute('data-id');
                const tName = row.getAttribute('data-name');
                const selectedRadio = row.querySelector(`input[name="status_${tId}"]:checked`);
                const status = selectedRadio ? selectedRadio.value : 'Alpha';
                
                attendanceList.push({ teacherId: tId, teacherName: tName, status: status });
            });

            const dataToSave = {
                eventId: state.currentEvent.id,
                date: state.selectedDate,
                attendanceList: attendanceList
            };

            showLoading("Menyimpan absensi...");
            try {
                await postToGAS('saveAttendance', dataToSave);
                showToast("Absensi berhasil disimpan!");
            } catch (error) {
                showToast("Gagal menyimpan data", "error");
            } finally {
                hideLoading();
            }
        }

        // ==========================================
        // EXPORT PDF LOGIC
        // ==========================================
        async function generatePDF() {
            showLoading("Mengumpulkan data untuk PDF...");
            try {
                const allAtt = await fetchFromGAS('getAllAttendanceForEvent', { eventId: state.currentEvent.id });
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape'); 
                
                doc.setFontSize(16);
                doc.text(`Rekapitulasi Kehadiran: ${state.currentEvent.name}`, 14, 15);
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`Periode: ${formatDate(state.currentEvent.startDate)} - ${formatDate(state.currentEvent.endDate)}`, 14, 22);

                const uniqueDates = [...new Set(allAtt.map(item => item.date))].sort();
                
                if(uniqueDates.length === 0) {
                    hideLoading();
                    showToast("Belum ada data absensi untuk direkap.", "error");
                    return;
                }

                const head = [['No', 'Nama Guru', ...uniqueDates.map(d => formatDate(d).split(' ')[0] + ' ' + formatDate(d).split(' ')[1])]];
                
                const body = [];
                state.teachers.forEach((teacher, index) => {
                    let row = [index + 1, teacher.name];
                    
                    uniqueDates.forEach(date => {
                        const attRecord = allAtt.find(a => a.teacherId == teacher.id && a.date === date);
                        let statusText = '-';
                        if(attRecord) {
                            if(attRecord.status === 'Hadir Penuh') statusText = 'Hadir';
                            else if (attRecord.status === 'Hadir Sebagian') statusText = 'Muleh Disek';
                            else if (attRecord.status === 'Izin') statusText = 'Izin';
                            else if (attRecord.status === 'Alpha') statusText = 'Mbolos';
                        }
                        row.push(statusText);
                    });
                    body.push(row);
                });

                doc.autoTable({
                    head: head,
                    body: body,
                    startY: 30,
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129] },
                    styles: { fontSize: 8, cellPadding: 2 },
                    columnStyles: { 0: { halign: 'center', cellWidth: 10 } },
                    didDrawPage: function (data) {
                        doc.setFontSize(8);
                        doc.text(
                            `Keterangan: Hadir = Hadir Penuh | Muleh Disek = Hadir Sebagian | Izin = Izin | Mbolos = Alpha`, 
                            data.settings.margin.left, 
                            doc.internal.pageSize.height - 10
                        );
                    }
                });

                doc.save(`Rekap_${state.currentEvent.name.replace(/\s+/g, '_')}.pdf`);
                showToast("PDF Berhasil dibuat!");

            } catch (error) {
                console.error(error);
                showToast("Gagal membuat PDF", "error");
            } finally {
                hideLoading();
            }
        }

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
