<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Kegiatan Madrasah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & AutoTable untuk PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        madrasah: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #059669; }
        
        /* Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 transform translate-x-full transition-transform duration-300 z-50 rounded shadow-lg flex items-center px-4 py-3 text-white font-medium">
        <i id="toast-icon" class="fas mr-2"></i>
        <span id="toast-msg">Pesan</span>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/80 z-40 hidden flex-col items-center justify-center">
        <div class="loader mb-3"></div>
        <p class="text-madrasah-600 font-semibold" id="loading-text">Memuat data...</p>
    </div>

    <!-- NAVBAR -->
    <nav id="navbar" class="bg-madrasah-600 text-white shadow-md hidden">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 text-xl font-bold">
                <i class="fas fa-mosque"></i>
                <span>Absensi Madrasah</span>
            </div>
            <button onclick="logout()" class="hover:bg-madrasah-700 px-3 py-1 rounded transition">
                <i class="fas fa-sign-out-alt mr-1"></i> Keluar
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow container mx-auto px-4 py-6" id="app-content">
        <!-- Views will be injected here by JavaScript -->
    </main>

    <!-- TEMPLATES (Hidden, used by JS) -->

    <!-- 1. LOGIN VIEW -->
    <template id="tpl-login">
        <div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden p-8 border-t-4 border-madrasah-500">
            <div class="text-center mb-6">
                <div class="bg-madrasah-50 text-madrasah-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-shield-alt text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Login Admin</h2>
                <p class="text-sm text-gray-500 mt-1">Sistem Rekap Kehadiran Kegiatan</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-madrasah-500" id="password" type="password" placeholder="Masukkan password admin" required>
                </div>
                <button class="w-full bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition" type="submit">
                    Masuk
                </button>
            </form>
        </div>
    </template>

    <!-- 2. DASHBOARD VIEW -->
    <template id="tpl-dashboard">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800 border-l-4 border-madrasah-500 pl-3">Daftar Kegiatan</h2>
            <button onclick="navigate('createEvent')" class="bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-2 px-4 rounded shadow transition flex items-center">
                <i class="fas fa-plus mr-2"></i> Buat Kegiatan
            </button>
        </div>
        <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Event cards will be populated here -->
        </div>
    </template>

    <!-- 3. CREATE EVENT VIEW -->
    <template id="tpl-create-event">
        <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6 border-t-4 border-madrasah-500">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-calendar-plus mr-2 text-madrasah-600"></i>Buat Kegiatan Baru</h2>
                <button onclick="navigate('dashboard')" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form onsubmit="handleCreateEvent(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nama Kegiatan</label>
                    <input id="ev-name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-madrasah-500" type="text" placeholder="Contoh: MPLS 2026" required>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tanggal Mulai</label>
                        <input id="ev-start" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-madrasah-500" type="date" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tanggal Selesai</label>
                        <input id="ev-end" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-madrasah-500" type="date" required>
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="navigate('dashboard')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded transition">Batal</button>
                    <button type="submit" class="bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-2 px-4 rounded shadow transition">Simpan Kegiatan</button>
                </div>
            </form>
        </div>
    </template>

    <!-- 4. ATTENDANCE VIEW -->
    <template id="tpl-attendance">
        <div class="mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <button onclick="navigate('dashboard')" class="text-madrasah-600 hover:text-madrasah-800 text-sm font-semibold mb-2 inline-block"><i class="fas fa-arrow-left mr-1"></i> Kembali</button>
                <h2 id="att-event-name" class="text-2xl font-bold text-gray-800">Nama Acara</h2>
                <p id="att-event-dates" class="text-sm text-gray-600"><i class="far fa-calendar-alt mr-1"></i> - </p>
            </div>
            <div class="flex gap-2">
                <button onclick="generatePDF()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow transition flex items-center">
                    <i class="fas fa-file-pdf mr-2"></i> Rekap PDF
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-4 mb-6 border-l-4 border-blue-500 flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-3">
                <label class="font-bold text-gray-700 whitespace-nowrap">Pilih Tanggal Absen:</label>
                <input type="date" id="att-date-picker" onchange="loadAttendanceData()" class="border rounded py-1 px-2 focus:ring-2 focus:ring-madrasah-500 outline-none">
            </div>
            <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full"><i class="fas fa-info-circle mr-1"></i>Pilih tanggal dalam rentang kegiatan</span>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-madrasah-50 text-madrasah-700 text-sm uppercase">
                            <th class="py-3 px-4 border-b font-semibold w-12">No</th>
                            <th class="py-3 px-4 border-b font-semibold min-w-[200px]">Nama Guru</th>
                            <th class="py-3 px-4 border-b font-semibold text-center">Hadir Penuh</th>
                            <th class="py-3 px-4 border-b font-semibold text-center">Hadir Sebagian</th>
                            <th class="py-3 px-4 border-b font-semibold text-center">Izin</th>
                            <th class="py-3 px-4 border-b font-semibold text-center">Alpha</th>
                        </tr>
                    </thead>
                    <tbody id="att-table-body" class="text-sm">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
            <div class="p-4 bg-gray-50 border-t flex justify-end">
                <button onclick="saveAttendance()" class="bg-madrasah-600 hover:bg-madrasah-700 text-white font-bold py-2 px-6 rounded shadow transition flex items-center">
                    <i class="fas fa-save mr-2"></i> Simpan Kehadiran
                </button>
            </div>
        </div>
    </template>

    <script>
        // ==========================================
        // KONFIGURASI UTAMA
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA!
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwaH1_xCndRlhKu-Pw7HxvHolCnp9a_87e6kB-LvPMQIFcFDyEoZrPjoJjcqeEAbL8V/exec"; 
        const ADMIN_PASSWORD = "admin"; // Ganti dengan password yang diinginkan

        // State Aplikasi
        let state = {
            isLoggedIn: false,
            events: [],
            teachers: [],
            currentEvent: null,
            selectedDate: null,
            currentAttendance: []
        };

        // ==========================================
        // UTILITAS UI
        // ==========================================
        function showLoading(text = "Memuat...") {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('loading').classList.add('flex');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('loading').classList.remove('flex');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-msg');
            
            msg.innerText = message;
            toast.className = 'fixed top-5 right-5 transform transition-transform duration-300 z-50 rounded shadow-lg flex items-center px-4 py-3 text-white font-medium';
            
            if (type === 'success') {
                toast.classList.add('bg-green-500', 'translate-x-0');
                icon.className = 'fas fa-check-circle mr-2';
            } else if (type === 'error') {
                toast.classList.add('bg-red-500', 'translate-x-0');
                icon.className = 'fas fa-exclamation-circle mr-2';
            } else {
                toast.classList.add('bg-blue-500', 'translate-x-0');
                icon.className = 'fas fa-info-circle mr-2';
            }

            setTimeout(() => {
                toast.classList.remove('translate-x-0');
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        function formatDate(dateString) {
            if(!dateString) return "-";
            const d = new Date(dateString);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // ==========================================
        // FUNGSI API (Komunikasi dengan GAS)
        // ==========================================
        async function fetchFromGAS(action, params = {}) {
            let url = new URL(GAS_URL);
            url.searchParams.append('action', action);
            for (let key in params) {
                url.searchParams.append(key, params[key]);
            }
            
            try {
                const response = await fetch(url.toString());
                const result = await response.json();
                if (result.status === "error") throw new Error(result.message);
                return result.data;
            } catch (error) {
                console.error("Fetch Error:", error);
                throw error;
            }
        }

        async function postToGAS(action, data) {
            try {
                // Menggunakan form data x-www-form-urlencoded untuk GAS doPost
                const formData = new URLSearchParams();
                formData.append('action', action);
                formData.append('data', JSON.stringify(data));

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.status === "error") throw new Error(result.message);
                return result.data;
            } catch (error) {
                console.error("Post Error:", error);
                throw error;
            }
        }

        // ==========================================
        // ROUTING & RENDERING
        // ==========================================
        function initApp() {
            if (state.isLoggedIn) {
                document.getElementById('navbar').classList.remove('hidden');
                loadInitialData().then(() => navigate('dashboard'));
            } else {
                document.getElementById('navbar').classList.add('hidden');
                navigate('login');
            }
        }

        function navigate(view) {
            const content = document.getElementById('app-content');
            content.innerHTML = '';
            let tpl;

            if (view === 'login') tpl = document.getElementById('tpl-login').innerHTML;
            if (view === 'dashboard') {
                tpl = document.getElementById('tpl-dashboard').innerHTML;
                content.innerHTML = tpl;
                renderEventsList();
                return;
            }
            if (view === 'createEvent') tpl = document.getElementById('tpl-create-event').innerHTML;
            if (view === 'attendance') {
                tpl = document.getElementById('tpl-attendance').innerHTML;
                content.innerHTML = tpl;
                setupAttendanceView();
                return;
            }

            content.innerHTML = tpl;
        }

        // ==========================================
        // LOGIC APLIKASI
        // ==========================================
        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            if (pass === ADMIN_PASSWORD) {
                state.isLoggedIn = true;
                showToast('Login berhasil!');
                initApp();
            } else {
                showToast('Password salah!', 'error');
            }
        }

        function logout() {
            state.isLoggedIn = false;
            initApp();
        }

        async function loadInitialData() {
            showLoading("Memuat data sistem...");
            try {
                // Load events and teachers parallel
                const [events, teachers] = await Promise.all([
                    fetchFromGAS('getEvents'),
                    fetchFromGAS('getTeachers')
                ]);
                state.events = events;
                state.teachers = teachers;
            } catch (error) {
                showToast("Gagal memuat data. Periksa koneksi atau URL Script.", "error");
            } finally {
                hideLoading();
            }
        }

        function renderEventsList() {
            const grid = document.getElementById('events-grid');
            if (state.events.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 bg-white rounded-lg border border-dashed border-gray-300">
                    <i class="fas fa-folder-open text-4xl mb-3 text-gray-300 block"></i>
                    Belum ada kegiatan. Silakan buat baru.
                </div>`;
                return;
            }

            grid.innerHTML = state.events.map(ev => {
                const sDate = new Date(ev.startDate);
                const eDate = new Date(ev.endDate);
                const now = new Date();
                
                // Simple status logic
                let statusBadge = '';
                if(now < sDate) statusBadge = '<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-blue-400">Akan Datang</span>';
                else if (now >= sDate && now <= eDate) statusBadge = '<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-green-400">Berlangsung</span>';
                else statusBadge = '<span class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-gray-400">Selesai</span>';

                return `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition border border-gray-100 flex flex-col">
                    <div class="p-5 flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-bold text-gray-800">${ev.name}</h3>
                            ${statusBadge}
                        </div>
                        <p class="text-sm text-gray-600 mb-1"><i class="fas fa-calendar-play mr-2 text-madrasah-500"></i> ${formatDate(ev.startDate)}</p>
                        <p class="text-sm text-gray-600"><i class="fas fa-calendar-check mr-2 text-red-400"></i> ${formatDate(ev.endDate)}</p>
                    </div>
                    <div class="bg-gray-50 p-4 border-t border-gray-100 flex justify-end">
                        <button onclick="openAttendance('${ev.id}')" class="text-madrasah-600 hover:text-madrasah-800 font-semibold text-sm flex items-center">
                            Kelola Absensi <i class="fas fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function handleCreateEvent(e) {
            e.preventDefault();
            const name = document.getElementById('ev-name').value;
            const start = document.getElementById('ev-start').value;
            const end = document.getElementById('ev-end').value;

            if (new Date(start) > new Date(end)) {
                showToast("Tanggal selesai tidak boleh lebih awal dari tanggal mulai", "error");
                return;
            }

            showLoading("Menyimpan kegiatan...");
            try {
                const newEvent = { name, startDate: start, endDate: end };
                const res = await postToGAS('createEvent', newEvent);
                newEvent.id = res.id;
                state.events.push(newEvent); // Update local state
                showToast("Kegiatan berhasil dibuat!");
                navigate('dashboard');
            } catch (error) {
                showToast("Gagal menyimpan kegiatan", "error");
            } finally {
                hideLoading();
            }
        }

        // ==========================================
        // LOGIC ATTENDANCE (ABSENSI)
        // ==========================================
        function openAttendance(eventId) {
            state.currentEvent = state.events.find(e => e.id === eventId);
            if (!state.currentEvent) return;
            
            // Set default date to today, or start date if today is before start date
            const todayStr = new Date().toISOString().split('T')[0];
            const startStr = state.currentEvent.startDate.split('T')[0]; // Handle if timestamp
            
            if (todayStr < startStr) state.selectedDate = startStr;
            else state.selectedDate = todayStr;

            navigate('attendance');
        }

        function setupAttendanceView() {
            const ev = state.currentEvent;
            document.getElementById('att-event-name').innerText = ev.name;
            document.getElementById('att-event-dates').innerHTML = `<i class="far fa-calendar-alt mr-1"></i> ${formatDate(ev.startDate)} s/d ${formatDate(ev.endDate)}`;
            
            const dp = document.getElementById('att-date-picker');
            // Format for input type="date" must be YYYY-MM-DD
            dp.min = new Date(ev.startDate).toISOString().split('T')[0];
            dp.max = new Date(ev.endDate).toISOString().split('T')[0];
            dp.value = state.selectedDate;

            loadAttendanceData();
        }

        async function loadAttendanceData() {
            state.selectedDate = document.getElementById('att-date-picker').value;
            if(!state.selectedDate) return;

            showLoading("Memuat data absensi...");
            try {
                // Fetch saved attendance for this date
                const attData = await fetchFromGAS('getAttendance', {
                    eventId: state.currentEvent.id,
                    date: state.selectedDate
                });
                state.currentAttendance = attData || [];
                renderAttendanceTable();
            } catch (error) {
                showToast("Gagal memuat absensi", "error");
            } finally {
                hideLoading();
            }
        }

        function renderAttendanceTable() {
            const tbody = document.getElementById('att-table-body');
            
            if (state.teachers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-red-500">Data guru kosong. Silakan isi Sheet 'Teachers' terlebih dahulu.</td></tr>`;
                return;
            }

            let html = '';
            state.teachers.forEach((teacher, index) => {
                // Check if already has status
                const existing = state.currentAttendance.find(a => a.teacherId == teacher.id);
                const status = existing ? existing.status : 'Alpha'; // Default Alpha

                html += `
                <tr class="border-b hover:bg-gray-50 teacher-row" data-id="${teacher.id}" data-name="${teacher.name}">
                    <td class="py-3 px-4">${index + 1}</td>
                    <td class="py-3 px-4 font-medium">${teacher.name}</td>
                    <td class="py-3 px-4 text-center">
                        <input type="radio" name="status_${teacher.id}" value="Hadir Penuh" class="w-5 h-5 text-green-600 focus:ring-green-500" ${status === 'Hadir Penuh' ? 'checked' : ''}>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <input type="radio" name="status_${teacher.id}" value="Hadir Sebagian" class="w-5 h-5 text-yellow-500 focus:ring-yellow-500" ${status === 'Hadir Sebagian' ? 'checked' : ''}>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <input type="radio" name="status_${teacher.id}" value="Izin" class="w-5 h-5 text-blue-500 focus:ring-blue-500" ${status === 'Izin' ? 'checked' : ''}>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <input type="radio" name="status_${teacher.id}" value="Alpha" class="w-5 h-5 text-red-500 focus:ring-red-500" ${status === 'Alpha' ? 'checked' : ''}>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        async function saveAttendance() {
            if(!state.selectedDate) {
                showToast("Pilih tanggal terlebih dahulu", "error");
                return;
            }

            const rows = document.querySelectorAll('.teacher-row');
            let attendanceList = [];

            rows.forEach(row => {
                const tId = row.getAttribute('data-id');
                const tName = row.getAttribute('data-name');
                const selectedRadio = row.querySelector(`input[name="status_${tId}"]:checked`);
                const status = selectedRadio ? selectedRadio.value : 'Alpha';
                
                attendanceList.push({ teacherId: tId, teacherName: tName, status: status });
            });

            const dataToSave = {
                eventId: state.currentEvent.id,
                date: state.selectedDate,
                attendanceList: attendanceList
            };

            showLoading("Menyimpan absensi...");
            try {
                await postToGAS('saveAttendance', dataToSave);
                showToast("Absensi berhasil disimpan!");
            } catch (error) {
                showToast("Gagal menyimpan data", "error");
            } finally {
                hideLoading();
            }
        }

        // ==========================================
        // EXPORT PDF LOGIC
        // ==========================================
        async function generatePDF() {
            showLoading("Mengumpulkan data untuk PDF...");
            try {
                // Fetch ALL attendance for this event
                const allAtt = await fetchFromGAS('getAllAttendanceForEvent', { eventId: state.currentEvent.id });
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape'); // Landscape better for many days
                
                // Add Header
                doc.setFontSize(16);
                doc.text(`Rekapitulasi Kehadiran: ${state.currentEvent.name}`, 14, 15);
                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`Periode: ${formatDate(state.currentEvent.startDate)} - ${formatDate(state.currentEvent.endDate)}`, 14, 22);

                // Process Data into Matrix [Teacher x Date]
                // 1. Get Unique Dates that have attendance recorded
                const uniqueDates = [...new Set(allAtt.map(item => item.date))].sort();
                
                if(uniqueDates.length === 0) {
                    hideLoading();
                    showToast("Belum ada data absensi untuk direkap.", "error");
                    return;
                }

                // 2. Prepare Columns
                const head = [['No', 'Nama Guru', ...uniqueDates.map(d => formatDate(d).split(' ')[0] + ' ' + formatDate(d).split(' ')[1])]];
                
                // 3. Prepare Rows
                const body = [];
                state.teachers.forEach((teacher, index) => {
                    let row = [index + 1, teacher.name];
                    
                    uniqueDates.forEach(date => {
                        // Find if this teacher has attendance on this date
                        const attRecord = allAtt.find(a => a.teacherId == teacher.id && a.date === date);
                        let statusText = '-';
                        if(attRecord) {
                            if(attRecord.status === 'Hadir Penuh') statusText = 'V';
                            else if (attRecord.status === 'Hadir Sebagian') statusText = '1/2';
                            else if (attRecord.status === 'Izin') statusText = 'I';
                            else if (attRecord.status === 'Alpha') statusText = 'X';
                        }
                        row.push(statusText);
                    });
                    body.push(row);
                });

                // Generate Table
                doc.autoTable({
                    head: head,
                    body: body,
                    startY: 30,
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129] }, // madrasah-500 color
                    styles: { fontSize: 8, cellPadding: 2 },
                    columnStyles: { 0: { halign: 'center', cellWidth: 10 } },
                    didDrawPage: function (data) {
                        // Footer
                        doc.setFontSize(8);
                        doc.text(
                            `Keterangan: V = Hadir Penuh | 1/2 = Hadir Sebagian | I = Izin | X = Alpha`, 
                            data.settings.margin.left, 
                            doc.internal.pageSize.height - 10
                        );
                    }
                });

                doc.save(`Rekap_${state.currentEvent.name.replace(/\s+/g, '_')}.pdf`);
                showToast("PDF Berhasil dibuat!");

            } catch (error) {
                console.error(error);
                showToast("Gagal membuat PDF", "error");
            } finally {
                hideLoading();
            }
        }

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
